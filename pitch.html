  function miniMap() {
    // Chile–Argentina pilot area: dots at the landing map positions (viewBox crop of the 501×1000 map)
    var pts = [['ref', 133.8, 194.9, '#F2F4F5'], ['cl2', 143.8, 212.6, '#0297DE'], ['cl1', 139.2, 217.4, '#0297DE'], ['cl3', 143.7, 222.3, '#0297DE'], ['ar3', 197.5, 237.5, '#7FC8EF'], ['ar1', 188.4, 247.2, '#7FC8EF'], ['ar2', 192.9, 252.1, '#7FC8EF']];
    return '<svg viewBox="95 150 140 140" style="width:calc(var(--u)*20);height:calc(var(--u)*20);display:block" role="img" aria-label="map">' +
      '<path d="' + CHILE + '" fill="rgba(127,200,239,.13)" stroke="#7FC8EF" stroke-width="1"/>' +
      pts.map(function (p) { return '<circle cx="' + p[1] + '" cy="' + p[2] + '" r="2.6" fill="' + p[3] + '"><animate attributeName="r" values="2.6;4;2.6" dur="2.4s" repeatCount="indefinite"/></circle>'; }).join('') +
      '<text x="200" y="228" fill="#7FC8EF" font-family="Martian Mono,monospace" font-size="6">AR</text><text x="104" y="232" fill="#7FC8EF" font-family="Martian Mono,monospace" font-size="6">CL</text></svg>';
  }

  function incline() {
    // block on a slope: weight split into along-slope and normal components (θ = 20°)
    return '<svg class="incl" viewBox="0 0 400 230" role="img" aria-label="μ ≥ tan θ" style="overflow:visible">' +
      '<path d="M20 210 L380 210 L380 79 Z" fill="rgba(127,200,239,.08)" stroke="#7FC8EF" stroke-width="2"/>' +
      '<path d="M90 210 A70 70 0 0 0 85.8 186.1" fill="none" stroke="#FC734D" stroke-width="2"/>' +
      '<text x="98" y="203" fill="#FC734D" font-family="Martian Mono,monospace" font-size="16">θ = 20°</text>' +
      '<g transform="translate(205 143) rotate(-20)"><rect x="-34" y="-34" width="68" height="34" rx="6" fill="#0297DE"/><circle cx="-20" cy="2" r="9" fill="#02070A" stroke="#7FC8EF" stroke-width="2"/><circle cx="20" cy="2" r="9" fill="#02070A" stroke="#7FC8EF" stroke-width="2"/>' +
      '<line x1="0" y1="-17" x2="-70" y2="-17" stroke="#FC734D" stroke-width="2.5" marker-end="url(#ah)"/><text x="-120" y="-24" fill="#FC734D" font-family="Martian Mono,monospace" font-size="13">g·sin θ</text>' +
      '<line x1="0" y1="-17" x2="62" y2="-17" stroke="#7FC8EF" stroke-width="2.5" marker-end="url(#ah2)"/><text x="40" y="-30" fill="#7FC8EF" font-family="Martian Mono,monospace" font-size="13">μ·g·cos θ</text></g>' +
      '<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FC734D"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7FC8EF"/></marker></defs></svg>';
  }

  // ---------- deck engine ----------
  var deck = document.getElementById('deck'), dotsEl = document.getElementById('dots'), bar = document.getElementById('bar'), ct = document.getElementById('ct'), hint = document.getElementById('hint');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var lang = 'es', cur = 0, secs = [], io, cues = false, cueEl = document.getElementById('cue');
  try { var q = new URLSearchParams(location.search).get('lang'); lang = q === 'en' || q === 'es' ? q : (localStorage.getItem('analogos-pitch-lang') || 'es'); cues = new URLSearchParams(location.search).get('cues') === '1'; } catch (e) {}

  function render() {
    var L = T[lang];
    document.documentElement.lang = lang;
    deck.innerHTML = slides(L);
    secs = [].slice.call(deck.querySelectorAll('.s'));
    dotsEl.innerHTML = '';
    secs.forEach(function (s, i) {
      var b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', String(i + 1));
      b.addEventListener('click', function () { go(i); }); dotsEl.appendChild(b);
    });
    [].forEach.call(document.querySelectorAll('#lang button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-l') === lang)); });
    hint.textContent = L.hint;
    if (io) io.disconnect();
    io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting && e.intersectionRatio > 0.55) { e.target.classList.add('on'); cur = secs.indexOf(e.target); mark(); } });
    }, { threshold: [0.55, 0.9] });
    secs.forEach(function (s) { io.observe(s); });
    secs[cur].scrollIntoView({ behavior: 'instant', block: 'start' });
    secs[cur].classList.add('on'); mark();
  }
  function mark() {
    [].forEach.call(dotsEl.children, function (b, i) { if (i === cur) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
    bar.style.width = ((cur + 1) / secs.length * 100) + '%';
    ct.textContent = String(cur + 1).padStart(2, '0') + ' / ' + String(secs.length).padStart(2, '0');
    if (cur > 0) hint.style.opacity = '0';
    var c = secs[cur] && secs[cur].getAttribute('data-cue');
    cueEl.hidden = !cues || !c;
    if (c) cueEl.innerHTML = '<span>' + T[lang].cueLabel + '</span> «' + c + '»';
    [].forEach.call(document.querySelectorAll('video[data-vid]'), function (v) { if (!secs[cur].contains(v) && !v.paused) v.pause(); });
  }
  function go(i) {
    i = Math.max(0, Math.min(secs.length - 1, i));
    cur = i; mark();
    secs[i].scrollIntoView({ behavior: reduced ? 'instant' : 'smooth', block: 'start' });
  }
  // one slide per wheel gesture (absorbs trackpad inertia)
  var lock = false, quietT = 0, acc = 0;
  window.addEventListener('wheel', function (e) {
    e.preventDefault();
    clearTimeout(quietT); quietT = setTimeout(function () { lock = false; acc = 0; }, 180);
    if (lock) return;
    acc += e.deltaY;
    if (Math.abs(acc) > 30) { lock = true; go(cur + (acc > 0 ? 1 : -1)); acc = 0; }
  }, { passive: false });
  window.addEventListener('keydown', function (e) {
    var key = e.key;
    if (['ArrowDown', 'PageDown', ' ', 'ArrowRight', 'Enter'].indexOf(key) >= 0) { e.preventDefault(); go(cur + 1); }
    else if (['ArrowUp', 'PageUp', 'ArrowLeft', 'Backspace'].indexOf(key) >= 0) { e.preventDefault(); go(cur - 1); }
    else if (key === 'Home') { e.preventDefault(); go(0); }
    else if (key === 'End') { e.preventDefault(); go(secs.length - 1); }
    else if (key === 'f' || key === 'F') { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(function () {}); else document.exitFullscreen(); }
    else if (key === 'l' || key === 'L') setLang(lang === 'en' ? 'es' : 'en');
    else if (key === 'n' || key === 'N') { cues = !cues; mark(); }
  });
  // touch: swipe one slide
  var ty = null;
  window.addEventListener('touchstart', function (e) { ty = e.touches[0].clientY; }, { passive: true });
  window.addEventListener('touchend', function (e) { if (ty === null) return; var d = ty - e.changedTouches[0].clientY; if (Math.abs(d) > 40) go(cur + (d > 0 ? 1 : -1)); ty = null; }, { passive: true });
  window.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  window.addEventListener('resize', function () { secs[cur] && secs[cur].scrollIntoView({ behavior: 'instant', block: 'start' }); });
  function setLang(l) { lang = l; try { localStorage.setItem('analogos-pitch-lang', l); } catch (e) {} render(); }
  [].forEach.call(document.querySelectorAll('#lang button'), function (b) { b.addEventListener('click', function () { setLang(b.getAttribute('data-l')); b.blur(); }); });

  render();
  if (window.AnalogNebula && !reduced) { try { var nb = document.getElementById('neb'); window.AnalogNebula(nb, { root: document, clicks: false, subtle: true }); nb.style.opacity = '0.34'; } catch (e) {} }
})();
</script>
</body>
