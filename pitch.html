        r: [['Pendiente 2,169° ≤ 2,3°', 'ok', 'Cumple'], ['Suelo desnudo ≥ 95 %', 'ok', 'Cumple'], ['Permisos de acceso', 'na', 'No evaluable'], ['Pampa Yungay (REF): 3,207°', 'no', 'No cumple']] },
      fun: { k: 'La búsqueda', h: 'Busca en vez de listar los análogos famosos.',
        rows: [['50', 'Ventanas evaluadas', 'grilla de ~20 km · ≈ 22.274 km² en Antofagasta (CL) y la Puna (AR)', 'var(--sky)', 1],
          ['4', 'Excluidas por precedente', 'contienen coordenadas de muestreo publicadas; siguen visibles', 'var(--orange)', .08],
          ['40', 'No seleccionadas', '2 por cercanía (< 25 km de una mejor), 38 por cupo de 3 por país', 'rgba(242,244,245,.4)', .8],
          ['6', 'Preseleccionadas', 'tres por país, con Sentinel-2 y NASA POWER', 'var(--blue)', .12],
          ['REF', 'Referencia conocida', 'Pampa Yungay recalculada con las mismas reglas: 75,67', 'var(--text)', .02]] },
      res: { k: 'Resultado · science-screening-v3', h: 'Seis candidatos, tres por país.', th: ['N.º', 'Sector', 'Región', 'Similitud', 'Confianza', 'Factibilidad'],
        reg: { cl: 'Interior de Antofagasta · Chile', ar: 'Puna de Catamarca y Salta · Argentina', ref: 'Referencia conocida · fuera del ranking' }, f: 'revisar',
        foot: 'Preliminar, no es una aprobación de sitio. Ningún candidato se declara análogo nuevo: ambas regiones tienen precedentes.' },
      ss: { k: 'Misma escala · dos planetas', h: '20 km de Jezero junto a 20 km del candidato 1.', mars: 'Marte · Jezero (CTX)', earth: 'Tierra · candidato 1 (Sentinel-2)',
        r: [['Pendiente mediana', 'Marte 2,23°', 'Tierra 2,17°'], ['Rugosidad', 'Marte 11,0 m', 'Tierra 11,3 m'], ['Relieve local 3×3', 'Marte 47 m', 'Tierra 46,8 m']],
        note: 'Comparado a ~460–480 m (escala MOLA). La nota usa elevación, no estas imágenes.' },
      sc: { k: 'Tres notas, nunca combinadas', h: 'Parecerse a Marte no basta.',
        c: [['Similitud', 'Seis criterios vs Jezero: pendiente, rugosidad, relieve, suelo desnudo, aridez y rango térmico.', 'var(--blue)'],
          ['Confianza', 'Cuánta evidencia entró. Los datos faltantes bajan la confianza, nunca la similitud.', 'var(--sky)'],
          ['Factibilidad', 'Una categoría, nunca una promesa: desconocida, revisar, potencialmente factible o excluida.', 'var(--orange)']] },
      ho: { k: 'Honestidad científica', h: 'Cada sitio viene con sus límites por escrito.',
        c: [['Lo que reproduce', ['Pendiente mediana 2,17° vs 2,23°', 'Relieve local 46,8 m vs 47 m', '100 % no vegetado · 11 mm de lluvia al año'], 'var(--blue)'],
          ['Dónde falla la analogía', ['Gravedad 0,38 g: carga y hundimiento de la rueda', 'Atmósfera < 1 % de la presión terrestre', 'A ~460 m no se ven obstáculos a escala de rueda'], 'var(--orange)'],
          ['Qué verificar en terreno', ['Suelo, cohesión, hundimiento, tracción', 'Terreno a escala cm–dm', 'Áreas protegidas, acceso, permisos'], 'var(--sky)']] },
      uc: { k: 'Quién hace estas pruebas', h: 'Las campañas análogas son reales. Elegir el sitio va primero.',
        hl: 'ARADS de la NASA trabajó en Yungay y también evaluó a mano Salar Grande y María Elena. AnalogOS hace esa comparación reproducible.',
        i: [['Movilidad de rovers', 'NASA ERNEST · ESA Seeker (Atacama)'], ['Perforación y detección de vida', 'NASA Ames · ARADS'], ['Ciencia remota', 'ESA · SAFER, ExoFiT'], ['Caminatas lunares y Artemis', 'NASA · JETT — siguiente: perfil Luna']] },
      team: { k: 'Equipo · Santiago de Chile', h: 'Cinco personas, un fin de semana.', roles: ['Diseño, narrativa y QA', 'Datos e ingeniería', 'Ciencia y modelo de notas', 'Frontend y mapa', 'Líder, alcance y pitch'] },
      end: { k: 'Pruébalo', h: 'Cuéntale tu prueba. Recibe el sitio, y por qué.', p: 'Datos abiertos: MOLA (NASA PDS) · NASADEM (NASA Earthdata) · Sentinel-2 (Copernicus/ESA) · NASA POWER · HLS (NASA CMR)', scan: 'Escanea para ver la landing' }
    }
  };

  function nm(s, L) { return L === T.es ? s.replace(/(\d)\.(\d)/g, '$1,$2') : s; }
  function k(n, txt, c) { return '<div class="k rv" style="--c:' + (c || 'var(--blue)') + '"><i></i><b>' + n + '</b><span>' + txt + '</span></div>'; }

  function slides(L) {
    var S = [];
    // 1 cover
    S.push('<section class="s cover" data-name="cover">' + k('AnalogOS', L.cover.k) +
      '<h1 class="rv">' + L.cover.h + '</h1>' +
      '<p class="lead rv mt2">' + L.cover.p + '</p>' +
      '<div class="chips rv mt"><div class="chip"><strong class="sk">' + L.cover.c1[0] + '</strong>' + L.cover.c1[1] + '</div><div class="chip"><strong class="b">' + L.cover.c2[0] + '</strong>' + L.cover.c2[1] + '</div></div>' +
      '<p class="mono rv mt" style="font-size:calc(var(--u)*.8);color:var(--dim);letter-spacing:.04em">' + L.cover.ch + '</p></section>');
    // 2 problem
    S.push('<section class="s">' + k('01', L.prob.k, 'var(--orange)') + '<p class="phrase rv">' + L.prob.h + '</p>' +
      '<div class="row rv mt">' + [L.prob.a, L.prob.b].map(function (x) { return '<div class="card" style="flex:1"><div class="mono" style="font-size:calc(var(--u)*.8);color:var(--orange);text-transform:uppercase;letter-spacing:.06em;margin-bottom:calc(var(--u)*.8)">' + x[0] + '</div><p style="font-size:calc(var(--u)*1.45);line-height:1.4">' + x[1] + '</p></div>'; }).join('') + '</div></section>');
    // 3 physics
    S.push('<section class="s">' + k('02', L.phys.k, 'var(--orange)') +
      '<div class="row" style="align-items:center;gap:calc(var(--u)*5)"><div style="flex:1.2">' +
      '<h2 class="rv">' + L.phys.h + '</h2><div class="law rv mt">μ ≥ tan θ</div><div class="eq rv">' + L.phys.eq + '</div>' +
      '<p class="lead rv mt2" style="font-size:calc(var(--u)*1.3)">' + L.phys.why + '</p></div>' +
      '<div class="rv" style="flex:1">' + incline() + '<div class="grid3 mt2">' + [L.phys.f1, L.phys.f2, L.phys.f3].map(function (f, i) { return '<div><div class="num ' + ['o', 'sk', 'b'][i] + '" style="font-size:calc(var(--u)*2.4)">' + f[0] + '</div><p style="font-size:calc(var(--u)*.95);color:var(--dim);margin-top:calc(var(--u)*.5);line-height:1.35">' + f[1] + '</p></div>'; }).join('') + '</div></div></div></section>');
    // 4 how
    S.push('<section class="s">' + k('03', L.how.k) + '<h2 class="rv">' + L.how.h + '</h2>' +
      '<div class="grid3 rv mt">' + L.how.s.map(function (s, i) { return '<div class="card step"><div class="n">0' + (i + 1) + '</div><h3>' + s[0] + '</h3><p>' + s[1] + '</p></div>'; }).join('') + '</div>' +
      '<div class="note rv mt2">' + L.how.note + '</div></section>');
    // 5 example
    S.push('<section class="s">' + k('04', L.ex.k, 'var(--sky)') + '<h2 class="rv">' + L.ex.h + '</h2>' +
      '<div class="row rv mt" style="gap:calc(var(--u)*2.4)"><div style="flex:1;display:flex;flex-direction:column;gap:calc(var(--u)*1.2)"><div class="quote">' + L.ex.q + '</div>' +
      '<div class="card" style="padding:calc(var(--u)*1.2) calc(var(--u)*1.6)">' + L.ex.reqs.map(function (r, i) { return '<div class="req"' + (i === L.ex.reqs.length - 1 ? ' style="border:0"' : '') + '><span class="tag ' + ['o', 'sk', ''][i] + '"' + (i === 2 ? ' style="color:var(--dim)"' : '') + '>' + r[0] + '</span>' + r[1] + '</div>'; }).join('') + '</div></div>' +
      '<div class="card" style="flex:1;border-color:rgba(2,151,222,.5)"><div class="mono" style="font-size:calc(var(--u)*.8);color:var(--sky);text-transform:uppercase;letter-spacing:.06em">' + L.ex.best + '</div><h3 style="margin-top:calc(var(--u)*.8);font-size:calc(var(--u)*1.7)">' + L.ex.name + '</h3>' +
      L.ex.r.map(function (r) { return '<div class="req" style="justify-content:space-between"><span>' + r[0] + '</span><span class="st ' + r[1] + '">' + r[2] + '</span></div>'; }).join('') + '</div></div></section>');
    // 6 funnel
    S.push('<section class="s">' + k('50 → 6', L.fun.k) + '<h2 class="rv">' + L.fun.h + '</h2>' +
      '<div class="fun rv mt">' + L.fun.rows.map(function (r) { return '<div class="v" style="color:' + r[3] + '">' + r[0] + '</div><div><div class="tr"><span style="width:' + (r[4] * 100) + '%;background:' + r[3] + '"></span></div><div class="d"><strong style="color:var(--text)">' + r[1] + '</strong> · ' + r[2] + '</div></div>'; }).join('') + '</div></section>');
    // 7 results
    S.push('<section class="s">' + k('05', L.res.k) + '<h2 class="rv">' + L.res.h + '</h2>' +
      '<div class="rv mt"><table><thead><tr>' + L.res.th.map(function (h, i) { return '<th' + (i > 2 ? ' style="text-align:right"' : '') + '>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' +
      ROWS.map(function (r, i) { var reg = r[0] === 'ref' ? L.res.reg.ref : L.res.reg[r[0].slice(0, 2)]; return '<tr class="' + (i === 0 ? 'top' : r[0] === 'ref' ? 'ref' : '') + '"><td class="m" style="color:var(--dim)">' + r[1] + '</td><td style="font-weight:600">' + nm(r[2], L) + '</td><td style="color:var(--dim);font-size:calc(var(--u)*1)">' + reg + '</td><td class="m b" style="text-align:right">' + nm(r[3], L) + '</td><td class="m sk" style="text-align:right">' + nm(r[4], L) + '</td><td class="m o" style="text-align:right">' + L.res.f + '</td></tr>'; }).join('') +
      '</tbody></table><p class="mono mt2" style="font-size:calc(var(--u)*.85);color:var(--sky)">' + L.res.foot + '</p></div></section>');
    // 8 same scale
    S.push('<section class="s">' + k('2 × 20 km', L.ss.k, 'var(--orange)') + '<h2 class="rv">' + L.ss.h + '</h2>' +
      '<div class="row rv mt" style="gap:calc(var(--u)*3)"><div class="pics" style="flex:1.4"><div class="pic"><img src="' + IMG.mars + '" alt="' + L.ss.mars + '"><span class="lab o">' + L.ss.mars + '</span></div><div class="pic"><img src="' + IMG.earth + '" alt="' + L.ss.earth + '"><span class="lab sk">' + L.ss.earth + '</span></div></div>' +
      '<div class="cmp" style="flex:1">' + L.ss.r.map(function (r) { return '<div class="r"><span>' + r[0] + '</span><b class="o">' + r[1] + '</b><b class="sk">' + r[2] + '</b></div>'; }).join('') + '<p class="mono" style="font-size:calc(var(--u)*.85);color:var(--dim);line-height:1.5">' + L.ss.note + '</p></div></div></section>');
    // 9 scores
    S.push('<section class="s">' + k('S · C · F', L.sc.k) + '<h2 class="rv">' + L.sc.h + '</h2>' +
      '<div class="grid3 rv mt">' + L.sc.c.map(function (c) { return '<div class="card" style="border-top:3px solid ' + c[2] + '"><h3 style="color:' + c[2] + ';font-size:calc(var(--u)*2.2)">' + c[0] + '</h3><p style="font-size:calc(var(--u)*1.3)">' + c[1] + '</p></div>'; }).join('') + '</div></section>');
    // 10 honesty
    S.push('<section class="s">' + k('06', L.ho.k, 'var(--orange)') + '<h2 class="rv">' + L.ho.h + '</h2>' +
      '<div class="grid3 rv mt">' + L.ho.c.map(function (c) { return '<div class="card" style="border-top:3px solid ' + c[2] + '"><h3>' + c[0] + '</h3><ul>' + c[1].map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div>'; }).join('') + '</div></section>');
    // 11 use cases
    S.push('<section class="s">' + k('NASA · ESA', L.uc.k, 'var(--orange)') + '<h2 class="rv">' + L.uc.h + '</h2>' +
      '<div class="card rv mt" style="background:linear-gradient(120deg,rgba(252,115,77,.16),rgba(252,115,77,.04));border-color:rgba(252,115,77,.45)"><p style="font-size:calc(var(--u)*1.7);font-weight:800;line-height:1.25;color:var(--text)">' + L.uc.hl + '</p></div>' +
      '<div class="rv mt2" style="display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*1.2)">' + L.uc.i.map(function (u) { return '<div class="card" style="padding:calc(var(--u)*1.4)"><h3 style="font-size:calc(var(--u)*1.35)">' + u[0] + '</h3><p class="mono" style="font-size:calc(var(--u)*.8);color:var(--dim)">' + u[1] + '</p></div>'; }).join('') + '</div></section>');
    // 12 team
    S.push('<section class="s">' + k('07', L.team.k, 'var(--sky)') + '<h2 class="rv">' + L.team.h + '</h2>' +
      '<div class="team rv mt">' + TEAM.map(function (m, i) { return '<div><div class="ph">' + (m[1] ? '<img src="assets/team/' + m[1] + '.jpg" alt="' + m[0] + '">' : m[0].charAt(0)) + '</div><div class="who"><b>' + m[0] + '</b><span>' + L.team.roles[i] + '</span></div></div>'; }).join('') + '</div></section>');
    // 13 close
    S.push('<section class="s">' + k('→', L.end.k, 'var(--orange)') +
      '<div class="close"><div><h2 class="rv" style="max-width:18ch">' + L.end.h + '</h2><div class="url rv mt">analogos.vercel.app</div>' +
      '<p class="mono rv mt" style="font-size:calc(var(--u)*.8);color:var(--dim);line-height:1.6;max-width:70ch">' + L.end.p + '</p></div>' +
      '<div class="rv" style="text-align:center"><div class="qr"><img src="assets/qr-landing.svg" alt="QR · analogos-landing.vercel.app"></div><p class="mono" style="font-size:calc(var(--u)*.8);color:var(--dim);margin-top:calc(var(--u)*.8)">' + L.end.scan + '</p></div></div></section>');
    return S.join('');
  }

  function incline() {
    // block on a slope: weight split into along-slope and normal components (θ = 20°)
    return '<svg class="incl" viewBox="0 0 400 230" role="img" aria-label="μ ≥ tan θ" style="overflow:visible">' +
      '<path d="M20 210 L380 210 L380 79 Z" fill="rgba(127,200,239,.08)" stroke="#7FC8EF" stroke-width="2"/>' +
      '<path d="M90 210 A70 70 0 0 0 85.8 186.1" fill="none" stroke="#FC734D" stroke-width="2"/>' +
      '<text x="98" y="203" fill="#FC734D" font-family="Martian Mono,monospace" font-size="16">θ = 20°</text>' +
      '<g transform="translate(205 143) rotate(-20)"><rect x="-34" y="-34" width="68" height="34" rx="6" fill="#0297DE"/><circle cx="-20" cy="2" r="9" fill="#02070A" stroke="#7FC8EF" stroke-width="2"/><circle cx="20" cy="2" r="9" fill="#02070A" stroke="#7FC8EF" stroke-width="2"/>' +
      '<line x1="0" y1="-17" x2="-70" y2="-17" stroke="#FC734D" stroke-width="2.5" marker-end="url(#ah)"/><text x="-120" y="-24" fill="#FC734D" font-family="Martian Mono,monospace" font-size="13">g·sin θ</text>' +
      '<line x1="0" y1="-17" x2="62" y2="-17" stroke="#7FC8EF" stroke-width="2.5" marker-end="url(#ah2)"/><text x="40" y="-30" fill="#7FC8EF" font-family="Martian Mono,monospace" font-size="13">μ·g·cos θ</text></g>' +
      '<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FC734D"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7FC8EF"/></marker></defs></svg>';
  }

  // ---------- deck engine ----------
  var deck = document.getElementById('deck'), dotsEl = document.getElementById('dots'), bar = document.getElementById('bar'), ct = document.getElementById('ct'), hint = document.getElementById('hint');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var lang = 'en', cur = 0, secs = [], io;
  try { var q = new URLSearchParams(location.search).get('lang'); lang = q === 'es' ? 'es' : (localStorage.getItem('analogos-pitch-lang') || 'en'); } catch (e) {}

  function render() {
    var L = T[lang];
    document.documentElement.lang = lang;
    deck.innerHTML = slides(L);
    secs = [].slice.call(deck.querySelectorAll('.s'));
    dotsEl.innerHTML = '';
    secs.forEach(function (s, i) {
      var b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', String(i + 1));
      b.addEventListener('click', function () { go(i); }); dotsEl.appendChild(b);
    });
    [].forEach.call(document.querySelectorAll('#lang button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-l') === lang)); });
    hint.textContent = L.hint;
    if (io) io.disconnect();
    io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting && e.intersectionRatio > 0.55) { e.target.classList.add('on'); cur = secs.indexOf(e.target); mark(); } });
    }, { threshold: [0.55, 0.9] });
    secs.forEach(function (s) { io.observe(s); });
    secs[cur].scrollIntoView({ behavior: 'instant', block: 'start' });
    secs[cur].classList.add('on'); mark();
  }
  function mark() {
    [].forEach.call(dotsEl.children, function (b, i) { if (i === cur) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
    bar.style.width = ((cur + 1) / secs.length * 100) + '%';
    ct.textContent = String(cur + 1).padStart(2, '0') + ' / ' + String(secs.length).padStart(2, '0');
    if (cur > 0) hint.style.opacity = '0';
  }
  function go(i) {
    i = Math.max(0, Math.min(secs.length - 1, i));
    cur = i; mark();
    secs[i].scrollIntoView({ behavior: reduced ? 'instant' : 'smooth', block: 'start' });
  }
  // one slide per wheel gesture (absorbs trackpad inertia)
  var lock = false, quietT = 0, acc = 0;
  window.addEventListener('wheel', function (e) {
    e.preventDefault();
    clearTimeout(quietT); quietT = setTimeout(function () { lock = false; acc = 0; }, 180);
    if (lock) return;
    acc += e.deltaY;
    if (Math.abs(acc) > 30) { lock = true; go(cur + (acc > 0 ? 1 : -1)); acc = 0; }
  }, { passive: false });
  window.addEventListener('keydown', function (e) {
    var key = e.key;
    if (['ArrowDown', 'PageDown', ' ', 'ArrowRight', 'Enter'].indexOf(key) >= 0) { e.preventDefault(); go(cur + 1); }
    else if (['ArrowUp', 'PageUp', 'ArrowLeft', 'Backspace'].indexOf(key) >= 0) { e.preventDefault(); go(cur - 1); }
    else if (key === 'Home') { e.preventDefault(); go(0); }
    else if (key === 'End') { e.preventDefault(); go(secs.length - 1); }
    else if (key === 'f' || key === 'F') { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(function () {}); else document.exitFullscreen(); }
    else if (key === 'l' || key === 'L') setLang(lang === 'en' ? 'es' : 'en');
  });
  // touch: swipe one slide
  var ty = null;
  window.addEventListener('touchstart', function (e) { ty = e.touches[0].clientY; }, { passive: true });
  window.addEventListener('touchend', function (e) { if (ty === null) return; var d = ty - e.changedTouches[0].clientY; if (Math.abs(d) > 40) go(cur + (d > 0 ? 1 : -1)); ty = null; }, { passive: true });
  window.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  window.addEventListener('resize', function () { secs[cur] && secs[cur].scrollIntoView({ behavior: 'instant', block: 'start' }); });
  function setLang(l) { lang = l; try { localStorage.setItem('analogos-pitch-lang', l); } catch (e) {} render(); }
  [].forEach.call(document.querySelectorAll('#lang button'), function (b) { b.addEventListener('click', function () { setLang(b.getAttribute('data-l')); b.blur(); }); });

  render();
  if (window.AnalogNebula && !reduced) { try { var nb = document.getElementById('neb'); window.AnalogNebula(nb, { root: document, clicks: false, subtle: true }); nb.style.opacity = '0.34'; } catch (e) {} }
})();
</script>
</body>
