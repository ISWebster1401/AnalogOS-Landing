<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Animated astronaut avatar">
  <!-- Original AnalogOS avatar (used instead of a photo: team member under 18, Space Apps rules). -->
  <style>
    .float{animation:float 4.5s ease-in-out infinite;transform-origin:200px 250px}
    .wave{animation:wave 2.2s ease-in-out infinite;transform-origin:292px 300px}
    .blink{animation:blink 5s infinite;transform-origin:200px 214px}
    .tw{animation:tw 3s ease-in-out infinite}
    .tw2{animation:tw 3s ease-in-out 1.4s infinite}
    .ant{animation:ant 1.8s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
    @keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
    @keyframes ant{0%,100%{fill:#FC734D}50%{fill:#FFD2C4}}
    @media (prefers-reduced-motion:reduce){.float,.wave,.blink,.tw,.tw2,.ant{animation:none}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A2236"/><stop offset="1" stop-color="#04101A"/></linearGradient>
    <radialGradient id="visor" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#7FC8EF"/><stop offset=".55" stop-color="#0297DE"/><stop offset="1" stop-color="#02324d"/></radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2F4F5"/><stop offset="1" stop-color="#C9D3DA"/></linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <circle class="tw" cx="62" cy="78" r="3" fill="#F2F4F5"/><circle class="tw2" cx="338" cy="60" r="2.5" fill="#7FC8EF"/>
  <circle class="tw2" cx="48" cy="360" r="2.5" fill="#FC734D"/><circle class="tw" cx="352" cy="420" r="3" fill="#F2F4F5"/>
  <circle cx="330" cy="130" r="26" fill="#FC734D" opacity=".85"/><ellipse cx="330" cy="130" rx="44" ry="9" fill="none" stroke="#F2F4F5" stroke-width="2" opacity=".6" transform="rotate(-18 330 130)"/>
  <g class="float">
    <!-- backpack -->
    <rect x="128" y="262" width="144" height="120" rx="26" fill="#8FA3B0"/>
    <!-- body -->
    <rect x="140" y="258" width="120" height="132" rx="44" fill="url(#suit)"/>
    <rect x="176" y="300" width="48" height="30" rx="8" fill="#02070A"/>
    <circle cx="190" cy="315" r="5" fill="#FC734D"/><circle cx="210" cy="315" r="5" fill="#7FC8EF"/>
    <!-- legs -->
    <rect x="152" y="370" width="38" height="58" rx="18" fill="url(#suit)"/><rect x="210" y="370" width="38" height="58" rx="18" fill="url(#suit)"/>
    <rect x="148" y="414" width="46" height="20" rx="10" fill="#FC734D"/><rect x="206" y="414" width="46" height="20" rx="10" fill="#FC734D"/>
    <!-- left arm -->
    <rect x="104" y="282" width="40" height="84" rx="20" fill="url(#suit)" transform="rotate(14 124 290)"/>
    <circle cx="104" cy="366" r="17" fill="#FC734D"/>
    <!-- waving arm -->
    <g class="wave"><rect x="268" y="226" width="40" height="84" rx="20" fill="url(#suit)" transform="rotate(-24 288 300)"/><circle cx="318" cy="222" r="17" fill="#FC734D"/></g>
    <!-- helmet -->
    <circle cx="200" cy="200" r="86" fill="url(#suit)"/>
    <rect x="186" y="98" width="28" height="22" rx="6" fill="#C9D3DA"/><rect x="197" y="80" width="6" height="22" fill="#C9D3DA"/><circle class="ant" cx="200" cy="76" r="9" fill="#FC734D"/>
    <rect x="128" y="150" width="144" height="104" rx="52" fill="url(#visor)"/>
    <!-- face behind visor -->
    <g class="blink"><ellipse cx="176" cy="208" rx="9" ry="12" fill="#02070A"/><ellipse cx="224" cy="208" rx="9" ry="12" fill="#02070A"/></g>
    <circle cx="179" cy="203" r="3" fill="#F2F4F5"/><circle cx="227" cy="203" r="3" fill="#F2F4F5"/>
    <path d="M184 230 Q200 244 216 230" fill="none" stroke="#02070A" stroke-width="5" stroke-linecap="round"/>
    <path d="M148 178 Q160 160 186 158" fill="none" stroke="#F2F4F5" stroke-width="7" stroke-linecap="round" opacity=".55"/>
  </g>
</svg>
